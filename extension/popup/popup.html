<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>TrustLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">T</div>
      <span class="title">TrustLens</span>
    </div>
    <button class="lang-toggle" id="langToggle" type="button">EN</button>
  </div>

  <textarea class="input-area" id="input" placeholder=""></textarea>
  <button class="btn" id="analyzeBtn"></button>

  <div class="loading hidden" id="loading">
    <div class="spinner"></div>
    <span id="loadingText"></span>
  </div>

  <div class="result hidden" id="result">
    <div class="score" id="score"></div>
    <div class="verdict" id="verdict"></div>
    <div class="pillars" id="pillars"></div>
  </div>

  <div class="scrape-failed hidden" id="scrapeFailed">
    <strong id="scrapeFailedTitle"></strong>
    <span id="scrapeFailedText"></span>
  </div>

  <div class="error hidden" id="error"></div>

  <div class="hint" id="hint"></div>

  <script src="popup.js"></script>
</body>
</html>
