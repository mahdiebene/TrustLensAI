<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>TrustLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="grain"></div>

  <div class="header">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 32 32" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M16 5 L25 8.2 V15 C25 20.2 21.4 24.2 16 26.5 C10.6 24.2 7 20.2 7 15 V8.2 Z" stroke="#3b82f6" stroke-width="1.6" stroke-linejoin="round" fill="none"></path>
          <circle cx="14.5" cy="14" r="3.6" stroke="#3b82f6" stroke-width="1.6" fill="none"></circle>
          <path d="M17.2 16.5 L20.5 19.8" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round"></path>
          <circle cx="14.5" cy="14" r="0.95" fill="#3b82f6"></circle>
        </svg>
      </div>
      <div class="brand-text">
        <span class="title">TrustLens</span>
        <span class="subtitle" id="subtitle"></span>
      </div>
    </div>
    <button class="lang-toggle" id="langToggle" type="button">EN</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" id="tabCheck" type="button" data-tab="check"></button>
    <button class="tab" id="tabHistory" type="button" data-tab="history"></button>
  </div>

  <div class="view" id="viewCheck">
    <div class="card input-card">
      <textarea class="input-area" id="input" placeholder="" rows="3"></textarea>
      <button class="btn-primary" id="analyzeBtn"></button>
    </div>

    <div class="loading hidden" id="loading">
      <div class="spinner"></div>
      <span id="loadingText"></span>
    </div>

    <div class="card result hidden" id="result">
      <div class="gauge">
        <svg class="gauge-svg" viewBox="0 0 120 120">
          <circle class="gauge-track" cx="60" cy="60" r="52" />
          <circle class="gauge-fill" id="gaugeFill" cx="60" cy="60" r="52" />
        </svg>
        <div class="gauge-center">
          <span class="score" id="score"></span>
          <span class="score-max">/100</span>
        </div>
      </div>
      <div class="verdict" id="verdict"></div>
      <div class="hr-soft"></div>
      <div class="pillars" id="pillars"></div>
    </div>

    <div class="card scrape-failed hidden" id="scrapeFailed">
      <div class="sf-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <strong id="scrapeFailedTitle"></strong>
      <span id="scrapeFailedText"></span>
    </div>

    <div class="error hidden" id="error"></div>

    <div class="hint" id="hint"></div>
  </div>

  <div class="view hidden" id="viewHistory">
    <div class="history-head">
      <span class="history-title" id="historyTitle"></span>
      <button class="history-clear" id="historyClear" type="button"></button>
    </div>
    <div class="history-list" id="historyList"></div>
    <div class="history-empty hidden" id="historyEmpty"></div>
  </div>

  <script src="popup.js"></script>

</body>
</html>
